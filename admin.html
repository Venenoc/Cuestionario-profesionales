<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respuestas – Registro de Profesionales</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      min-height: 100vh;
      padding: 40px 16px;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .sub {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-export { background: #43a047; color: #fff; }
    .btn-clear  { background: #e53935; color: #fff; }
    .btn-back   { background: rgba(255,255,255,0.2); color: #fff; text-decoration: none; display: inline-flex; align-items: center; }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 0.9rem;
    }

    thead tr { background: #1a237e; color: #fff; }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e8eaf6;
      white-space: nowrap;
    }

    td { color: #333; }
    tbody tr:hover { background: #f5f5f5; }

    .empty {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      text-align: center;
      padding: 40px;
      border-radius: 12px;
      font-size: 1rem;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.8rem;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1>Respuestas guardadas <span class="badge" id="totalBadge">0</span></h1>
  <p class="sub">Los datos se almacenan en este navegador (localStorage).</p>

  <div class="toolbar">
    <a class="btn btn-back" href="index.html">← Volver al formulario</a>
    <button class="btn btn-export" id="btnExport">⬇ Exportar CSV</button>
    <button class="btn btn-clear"  id="btnClear">🗑 Borrar todo</button>
  </div>

  <div id="content"></div>

  <script>
    const STORAGE_KEY = 'cuestionario_profesionales';
    const COLS = ['#', 'Nombre y Apellido', 'DNI', 'Profesión', 'Lugar de trabajo', 'Fecha'];

    function getResponses() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function render() {
      const responses = getResponses();
      document.getElementById('totalBadge').textContent = responses.length;
      const container = document.getElementById('content');

      if (responses.length === 0) {
        container.innerHTML = '<div class="empty">No hay respuestas guardadas todavía.</div>';
        return;
      }

      const rows = responses.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(r.nombre)}</td>
          <td>${esc(r.dni)}</td>
          <td>${esc(r.profesion)}</td>
          <td>${esc(r.trabajo)}</td>
          <td>${esc(r.fecha)}</td>
        </tr>`).join('');

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>${COLS.map(c => `<th>${c}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function toCsv(responses) {
      const header = ['Nombre y Apellido','DNI','Profesion','Lugar de trabajo','Fecha'];
      const lines  = responses.map(r =>
        [r.nombre, r.dni, r.profesion, r.trabajo, r.fecha]
          .map(v => `"${String(v ?? '').replace(/"/g,'""')}"`)
          .join(',')
      );
      return '\uFEFF' + [header.join(','), ...lines].join('\r\n');
    }

    document.getElementById('btnExport').addEventListener('click', () => {
      const responses = getResponses();
      if (responses.length === 0) { alert('No hay datos para exportar.'); return; }
      const blob = new Blob([toCsv(responses)], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `profesionales_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      if (confirm('¿Seguro que querés borrar todas las respuestas? Esta acción no se puede deshacer.')) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    });

    render();
  </script>
</body>
</html>
